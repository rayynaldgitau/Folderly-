name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG & App Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Universal macOS DMG and App Bundle
        run: |
          npx tauri build --target universal-apple-darwin || npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Ad-hoc code sign app bundle
        run: |
          find src-tauri/target -name "Foldy.app" -type d -exec codesign --force --deep --sign - {} \; 2>/dev/null || true

      - name: Upload macOS Installer & Updater Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foldy-macOS-Installer
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.tar.gz*
            src-tauri/target/**/latest.json
            scripts/fix-macos-gatekeeper.command

  build-windows:
    name: Build Windows Installer & Updater
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer & Updater
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows Installer & Updater Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foldy-Windows-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi*
            src-tauri/target/release/bundle/nsis/*.exe*
            src-tauri/target/release/bundle/nsis/*.sig*
            src-tauri/target/release/bundle/msi/*.sig*
            src-tauri/target/release/bundle/nsis/*.nsis.zip*
            src-tauri/target/release/latest.json

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: Foldy-macOS-Installer
          path: mac-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Foldy-Windows-Installer
          path: win-artifacts

      - name: Merge Multi-Platform Updater Manifests
        run: node scripts/merge-updater-manifests.js
        env:
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.3' }}
          name: Foldy ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.3' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # Foldy Release

            ### 📦 Download Installers
            - **macOS Installer (.dmg)**: Universal disk image supporting both Apple Silicon (M1/M2/M3/M4) & Intel Macs.
            - **macOS Helper (.command)**: Double-click helper to remove Gatekeeper quarantine with one click.
            - **Windows Setup (.exe)**: NSIS standalone graphical installer.
            - **Windows Package (.msi)**: Native MSI Windows installer.

            ---

            ### 🔄 Live In-App Updates Supported
            Existing Foldy desktop installations will automatically discover this release and can update with one click from **Preferences > Updates**!

            ---

            ### 🍎 Important Note for macOS Users ("Damaged and can't be opened"):
            Because Foldy is an open-source project and not signed with a paid Apple Developer Team ID ($99/year), macOS Gatekeeper blocks downloaded apps with:
            > *"Foldy is damaged and can't be opened. You should move it to the Trash."* OR *"Apple cannot check it for malicious software"*.

            **How to open on macOS:**
            1. Drag **Foldy.app** from the `.dmg` into your **/Applications** folder.
            2. Run this command in **Terminal**:
               ```bash
               xattr -cr /Applications/Foldy.app
               ```
               *(Or double-click the included `fix-macos-gatekeeper.command` helper script)*.
            3. Open Foldy normally!
          files: |
            mac-artifacts/**/*.dmg
            mac-artifacts/**/*.command
            mac-artifacts/**/*.tar.gz*
            win-artifacts/**/*.msi*
            win-artifacts/**/*.exe*
            win-artifacts/**/*.sig*
            win-artifacts/**/*.nsis.zip*
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
